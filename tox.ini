[tox]
env_list = py311, py3141
skip_missing_interpreters = false

[testenv]
package = editable
deps =
    pytest>=8
    pytest-asyncio>=0.23
commands =
    python -m compileall -q cygnus
    python -m pytest -q

[testenv:py311]
base_python = python3.11

[testenv:py3141]
base_python = python3.14
commands =
    python scripts/require_python.py 3.14.1
    python -m compileall -q cygnus
    python -m pytest -q
