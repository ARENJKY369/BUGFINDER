[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cygnus-hunter"
version = "3.3.1"
description = "Asset-aware, evidence-based passive security verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CYGNUS contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "tox>=4.23"]

[project.scripts]
cygnus = "cygnus.cli.main:main"

[tool.setuptools.packages.find]
include = ["cygnus*"]

[tool.setuptools.package-data]
cygnus = ["data/*.json", "assets/*.svg", "assets/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
