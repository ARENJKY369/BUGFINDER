[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cygnus-hunter"
version = "3.3.0"
description = "Asset-aware, evidence-based passive security verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CYGNUS contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
cygnus = "cygnus.cli.main:main"

[tool.setuptools.packages.find]
include = ["cygnus*"]

[tool.setuptools.package-data]
cygnus = ["data/*.json", "assets/*.svg", "assets/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
